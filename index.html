<meta charset="utf-8">
<title>Розкрій мозаїчного світильника</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: майстерня на розкрійному килимку — зліва липка панель параметрів, справа креслення й таблиці */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --sunken: #E7ECE8;
  --fg: #17211D;
  --muted: #5A6A63;
  --line: #D3DAD5;
  --accent: #1F6F5C;
  --accent-fg: #FFFFFF;
  --warn: #A8480F;
  --warn-bg: #FBEBDD;
  --grout: #BFC7C2;
  --chip-free: #E1E7E3;
  --acryl: #DDEBF0;
  --on-chip: #14201C;
  --f-top: #E3A93F;
  --f-front: #3DAE9C;
  --f-back: #5C8FE0;
  --f-left: #A87BD6;
  --f-right: #E67A63;
  --night: #07090A;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101714; --surface: #172019; --sunken: #0C120F; --fg: #E5ECE8; --muted: #93A49B;
    --line: #2A3730; --accent: #5FC7AA; --accent-fg: #0B1612; --warn: #F2A36B; --warn-bg: #3A2413;
    --grout: #0A0F0D; --chip-free: #25312B; --acryl: #1D3138; --on-chip: #14201C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101714; --surface: #172019; --sunken: #0C120F; --fg: #E5ECE8; --muted: #93A49B;
  --line: #2A3730; --accent: #5FC7AA; --accent-fg: #0B1612; --warn: #F2A36B; --warn-bg: #3A2413;
  --grout: #0A0F0D; --chip-free: #25312B; --acryl: #1D3138; --on-chip: #14201C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-inline: 16px; padding-block: 20px 48px;
}
.app { max-width: 1280px; margin-inline: auto; display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
header.top p { margin: 0; color: var(--muted); max-width: 65ch; }
.cols { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }

/* Параметри */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; }
@media (min-width: 901px) { .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; } }
fieldset { border: 0; margin: 0; padding: 16px; display: grid; gap: 10px; min-width: 0; }
fieldset + fieldset { border-top: 1px solid var(--line); }
legend { float: left; width: 100%; padding: 0; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
legend + * { clear: both; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.f { display: grid; gap: 3px; min-width: 0; }
.f > span { font-size: 12px; color: var(--muted); }
input[type="number"], select {
  width: 100%; font: inherit; font-family: var(--font-mono); font-size: 14px;
  padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--fg);
}
select { font-family: var(--font-body); }
textarea { width: 100%; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); resize: vertical; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tag { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--sunken); color: var(--muted); }
.tag.buy { background: var(--accent); color: var(--accent-fg); }
input:disabled { opacity: 0.55; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.hint b { color: var(--fg); font-family: var(--font-mono); font-weight: 600; }
button.reset { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; justify-self: start; }
button.reset:hover { border-color: var(--accent); color: var(--accent); }

/* Результати */
.out { display: grid; gap: 28px; min-width: 0; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.stat { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; display: grid; gap: 2px; align-content: start; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--muted); }
section { display: grid; gap: 12px; min-width: 0; }
h2 { font-size: 17px; font-weight: 700; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 13.5px; max-width: 70ch; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 0; }
.split { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: center; }
@media (max-width: 640px) { .split { grid-template-columns: minmax(0, 1fr); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.sheets.wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.faces { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
figcaption { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
figcaption b { color: var(--fg); font-weight: 600; }
svg { display: block; width: 100%; height: auto; max-width: 100%; }
svg.iso { max-height: 300px; }
.view3d { height: 360px; border: 1px solid var(--night); border-radius: 10px; background: var(--night); overflow: hidden; position: relative; }
.view3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.view3d canvas:active { cursor: grabbing; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
button.primary { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
button.primary:hover { filter: brightness(1.08); }
button.lamp { font: inherit; font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button.lamp[aria-pressed="true"] { background: var(--f-top); border-color: var(--f-top); color: var(--on-chip); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 2px; }
button.swatch { width: 34px; height: 34px; padding: 0; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; box-shadow: inset 0 0 0 2px var(--surface); }
button.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="color"] { width: 100%; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.formula { font-family: var(--font-mono); font-size: 13.5px; margin: 0; overflow-x: auto; white-space: nowrap; }
svg text { font-family: var(--font-mono); font-weight: 600; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td .sw { display: inline-block; vertical-align: -1px; margin-right: 6px; }
</style>

<div class="app">
  <header class="top">
    <h1>Розкрій мозаїчного світильника</h1>
    <p>Задайте розмір світильника в чіпах мозаїки. Сервіс розкладе 5 граней по листах мозаїки та порахує деталі з оргскла.</p>
  </header>

  <div class="cols">
    <form class="panel" id="form" autocomplete="off">
      <fieldset>
        <legend>Світильник, у чіпах</legend>
        <div class="row">
          <label class="f"><span>Ширина</span><input type="number" id="W" min="1" max="60" step="1"></label>
          <label class="f"><span>Глибина</span><input type="number" id="D" min="1" max="60" step="1"></label>
          <label class="f"><span>Висота</span><input type="number" id="H" min="1" max="60" step="1"></label>
        </div>
        <label class="check"><input type="checkbox" id="cube"> Куб, усі сторони однакові</label>
        <div class="row two">
          <label class="f"><span>Кількість світильників</span><input type="number" id="qty" min="1" max="50" step="1"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Мозаїка</legend>
        <div class="row two">
          <label class="f"><span>Чіп, мм</span><input type="number" id="chip" min="1" max="200" step="0.1"></label>
          <label class="f"><span>Товщина, мм</span><input type="number" id="tm" min="0" max="20" step="0.1"></label>
        </div>
        <div class="f"><span id="mcolorLabel">Колір</span>
          <input type="hidden" id="mcolor">
          <div class="swatches" id="swatches" role="group" aria-labelledby="mcolorLabel"></div>
          <p class="hint" id="mcolorHint"></p>
        </div>
        <div class="row two">
          <label class="f"><span>Шов на листі, мм</span><input type="number" id="sheetGap" min="0" max="20" step="0.1"></label>
          <label class="f"><span>Шов на виробі, мм</span><input type="number" id="gap" min="0" max="20" step="0.1"></label>
        </div>
        <div class="row two">
          <label class="f"><span>Чіпів у ряду</span><input type="number" id="cols" min="1" max="40" step="1"></label>
          <label class="f"><span>Рядів</span><input type="number" id="rows" min="1" max="40" step="1"></label>
        </div>
        <p class="hint" id="sheetHint"></p>
        <label class="check"><input type="checkbox" id="split"> Складати грань із залишків</label>
      </fieldset>

      <fieldset>
        <legend>Оргскло</legend>
        <div class="row">
          <label class="f"><span>Товщина, мм</span><input type="number" id="ta" min="0.5" max="20" step="0.1"></label>
          <label class="f"><span>Припуск на кут, мм</span><input type="number" id="edge" min="-20" max="50" step="0.1"></label>
          <label class="f"><span>Відступ знизу, мм</span><input type="number" id="bottom" min="0" max="200" step="0.1"></label>
        </div>
        <label class="f"><span>Кришка</span>
          <select id="lid">
            <option value="on">Лежить зверху на стінках</option>
            <option value="in">Вставлена між стінками</option>
          </select>
        </label>
        <label class="f"><span>Стик стінок</span>
          <select id="walls">
            <option value="fb">Передня й задня накривають бокові</option>
            <option value="pin">По колу, кожна накриває сусідню</option>
          </select>
        </label>
        <div class="row two">
          <label class="f"><span>Різ, мм</span><input type="number" id="kerf" min="0" max="10" step="0.1"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Листи оргскла</legend>
        <p class="hint">Сервіс вибирає найдешевший набір листів, у який влазять усі деталі.</p>
        <label class="f"><span>Формати в продажу: ширина, висота, ціна в грн</span>
          <textarea id="catalog" rows="10" spellcheck="false"></textarea>
        </label>
        <button type="button" class="reset" id="reset">Скинути до типових</button>
      </fieldset>
    </form>

    <div class="out" id="out"></div>
  </div>
</div>

<script>
// <logic>
var FACE_DEFS = [
  { key: 'top',   code: 'В',  name: 'Верх' },
  { key: 'front', code: 'П',  name: 'Перед' },
  { key: 'back',  code: 'З',  name: 'Зад' },
  { key: 'left',  code: 'Л',  name: 'Ліва' },
  { key: 'right', code: 'Пр', name: 'Права' }
];

function span(n, p) { return n * p.chip + (n - 1) * p.gap; }

// Грані в чіпах: h рядів × w стовпців
function buildFaces(p) {
  var faces = [];
  for (var l = 1; l <= p.qty; l++) {
    FACE_DEFS.forEach(function (d) {
      var h, w;
      if (d.key === 'top') { h = p.D; w = p.W; }
      else if (d.key === 'front' || d.key === 'back') { h = p.H; w = p.W; }
      else { h = p.H; w = p.D; }
      faces.push({ id: faces.length, key: d.key, name: d.name, lamp: l,
        code: (p.qty > 1 ? l + '·' : '') + d.code, h: h, w: w, pieces: [] });
    });
  }
  return faces;
}

// ---- Розкрій мозаїки на цілочисельній сітці чіпів ----
function newSheet(R, C) {
  return { R: R, C: C, grid: new Uint8Array(R * C), ps: new Int32Array((R + 1) * (C + 1)), free: R * C, pieces: [] };
}
function rebuildPs(s) {
  var R = s.R, C = s.C, W = C + 1;
  for (var r = 1; r <= R; r++) for (var c = 1; c <= C; c++)
    s.ps[r * W + c] = s.grid[(r - 1) * C + c - 1] + s.ps[(r - 1) * W + c] + s.ps[r * W + c - 1] - s.ps[(r - 1) * W + c - 1];
}
function occupied(s, r, c, h, w) {
  var W = s.C + 1;
  return s.ps[(r + h) * W + c + w] - s.ps[r * W + c + w] - s.ps[(r + h) * W + c] + s.ps[r * W + c];
}
function cellBusy(s, r, c) {
  return r < 0 || c < 0 || r >= s.R || c >= s.C || s.grid[r * s.C + c] === 1;
}
function contact(s, r, c, h, w) {
  var n = 0, i;
  for (i = 0; i < w; i++) { if (cellBusy(s, r - 1, c + i)) n++; if (cellBusy(s, r + h, c + i)) n++; }
  for (i = 0; i < h; i++) { if (cellBusy(s, r + i, c - 1)) n++; if (cellBusy(s, r + i, c + w)) n++; }
  return n;
}
function findSpot(s, h, w) {
  if (h > s.R || w > s.C || h * w > s.free) return null;
  var best = null;
  for (var r = 0; r + h <= s.R; r++) for (var c = 0; c + w <= s.C; c++) {
    if (occupied(s, r, c, h, w) !== 0) continue;
    var sc = contact(s, r, c, h, w);
    if (!best || sc > best.score) best = { r: r, c: c, h: h, w: w, score: sc };
  }
  return best;
}
function findSpotAny(s, h, w) {
  var a = findSpot(s, h, w);
  if (h === w) return a;
  var b = findSpot(s, w, h);
  if (a && b) return b.score > a.score ? b : a;
  return a || b;
}
function placePiece(sheets, si, spot, face, fr, fc, fh, fw) {
  var s = sheets[si];
  for (var r = spot.r; r < spot.r + spot.h; r++) for (var c = spot.c; c < spot.c + spot.w; c++) s.grid[r * s.C + c] = 1;
  s.free -= spot.h * spot.w;
  rebuildPs(s);
  var piece = { face: face, sheet: si, r: spot.r, c: spot.c, h: spot.h, w: spot.w,
    fr: fr, fc: fc, fh: fh, fw: fw, rotated: fh !== fw && spot.h === fw && spot.w === fh };
  s.pieces.push(piece);
  face.pieces.push(piece);
}
function cover(sheets, face, fr, fc, rh, rw) {
  if (rh <= 0 || rw <= 0) return true;
  var cands = [];
  for (var p = 1; p <= rh; p++) for (var q = 1; q <= rw; q++)
    cands.push({ p: p, q: q, a: p * q, full: (p === rh ? 1 : 0) + (q === rw ? 1 : 0) });
  cands.sort(function (x, y) { return y.a - x.a || y.full - x.full; });
  for (var i = 0; i < cands.length; i++) {
    var k = cands[i];
    for (var si = 0; si < sheets.length; si++) {
      var spot = findSpotAny(sheets[si], k.p, k.q);
      if (!spot) continue;
      placePiece(sheets, si, spot, face, fr, fc, k.p, k.q);
      return cover(sheets, face, fr, fc + k.q, k.p, rw - k.q) &&
             cover(sheets, face, fr + k.p, fc, rh - k.p, rw);
    }
  }
  return false;
}
function tryPack(faces, R, C, N, allowSplit) {
  var sheets = [], i;
  for (i = 0; i < N; i++) sheets.push(newSheet(R, C));
  faces.forEach(function (f) { f.pieces = []; });
  var order = faces.slice().sort(function (a, b) { return b.h * b.w - a.h * a.w || a.id - b.id; });
  var later = [];
  for (i = 0; i < order.length; i++) {
    var f = order[i], done = false;
    for (var si = 0; si < N && !done; si++) {
      var spot = findSpotAny(sheets[si], f.h, f.w);
      if (spot) { placePiece(sheets, si, spot, f, 0, 0, f.h, f.w); done = true; }
    }
    if (done) continue;
    var oversized = !((f.h <= R && f.w <= C) || (f.w <= R && f.h <= C));
    if (allowSplit || oversized) later.push(f); else return null;
  }
  for (i = 0; i < later.length; i++) if (!cover(sheets, later[i], 0, 0, later[i].h, later[i].w)) return null;
  return sheets;
}
function packMosaic(faces, R, C, allowSplit) {
  var total = faces.reduce(function (s, f) { return s + f.h * f.w; }, 0);
  var lower = Math.max(1, Math.ceil(total / (R * C)));
  for (var N = lower; N <= lower + faces.length + 5; N++) {
    var sheets = tryPack(faces, R, C, N, allowSplit);
    if (sheets) return { sheets: sheets, total: total, left: N * R * C - total };
  }
  return null;
}

// ---- Оргскло ----
function acrylicParts(p) {
  var Aw = span(p.W, p) + 2 * p.edge, Ad = span(p.D, p) + 2 * p.edge, Ah = span(p.H, p) + p.edge + p.bottom;
  var hw = p.lid === 'on' ? Ah - p.ta : Ah;
  var lidW = p.lid === 'on' ? Aw : Aw - 2 * p.ta, lidD = p.lid === 'on' ? Ad : Ad - 2 * p.ta;
  var fbW = p.walls === 'fb' ? Aw : Aw - p.ta, lrW = p.walls === 'fb' ? Ad - 2 * p.ta : Ad - p.ta;
  var one = [
    { key: 'top', name: 'Кришка', w: lidW, h: lidD },
    { key: 'front', name: 'Перед', w: fbW, h: hw },
    { key: 'back', name: 'Зад', w: fbW, h: hw },
    { key: 'left', name: 'Ліва', w: lrW, h: hw },
    { key: 'right', name: 'Права', w: lrW, h: hw }
  ];
  var parts = [];
  for (var l = 1; l <= p.qty; l++) one.forEach(function (o) {
    parts.push({ key: o.key, name: o.name, lamp: l, w: o.w, h: o.h });
  });
  return { Aw: Aw, Ad: Ad, Ah: Ah, one: one, parts: parts };
}
function placeInBin(bin, it, kerf) {
  var EPS = 1e-6, best = null;
  [[it.w, it.h, false], [it.h, it.w, true]].forEach(function (o, oi) {
    if (oi === 1 && it.w === it.h) return;
    var w = o[0] + kerf, h = o[1] + kerf;
    bin.free.forEach(function (fr) {

function download(p) {

    try {
      var url = URL.createObjectURL(new Blob([data], { type: 'application/zip' })), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      say('Файл ' + name + ' передано браузеру.');
    } catch (e) { say('Не вдалося зберегти файл у цьому вікні.'); }
  }
  if (window.claude && typeof window.claude.use === 'function') {

      });
    }, direct);
  } else direct();
}
